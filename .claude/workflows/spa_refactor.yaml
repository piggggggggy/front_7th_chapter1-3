# Metadata
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
meta:
  version: '1.0.0'
  architecture: 'lean'
  last_updated: '2025-11-05'

  workflow:
    execution_model:
      type: orchestrated
      orchestrator_role: coordination_only
      agent_execution: manual # Agents run via CLI

  philosophy:
    - 'Better structure enables better features'
    - 'Tests must stay GREEN always'
    - 'Incremental changes with continuous validation'
    - 'Commit frequently, rollback fearlessly'
    - 'Know when structure is good enough'

  principles:
    - 'Safety first: tests and build must pass'
    - 'One logical group at a time'
    - 'Update imports immediately'
    - 'Maintain backward compatibility'
    - 'Document changes inline'

  compatible_with:
    orchestrator: '>= 1.0'
    agents:
      - architect: '>= 2.0'
      - refactor: '>= 2.0'
      - qa: '>= 2.0'

    frameworks:
      - React: '>= 16.8'
      - Vue: '>= 3.0'
      - TypeScript: '>= 4.0'
      - Vite: '>= 4.0'

  related_workflows:
    - tdd-refactor # Code quality improvements after structure
    - quick-cleanup # Lighter alternative for minimal changes

  metrics_by_route:
    simple:
      time: '30-60 minutes'
      files: 2 # analysis + changes
      tokens: '~2,500'
      scope: '< 10 files'

    standard:
      time: '1-2 hours'
      files: 3 # analysis + changes + verification
      tokens: '~4,000'
      scope: '10-30 files'

    complex:
      time: '2-4 hours'
      files: 3 # deeper content
      tokens: '~6,000'
      scope: '> 30 files'

  common_patterns:
    component_organization:
      - 'Feature-based: features/auth/components/'
      - 'Domain-based: domains/user/components/'
      - 'Atomic design: atoms/, molecules/, organisms/'
      - 'Flat with prefixes: UserProfile.tsx, UserSettings.tsx'

    state_management:
      - 'Hooks: hooks/useAuth.ts, hooks/useCart.ts'
      - 'Store: store/auth/, store/cart/'
      - 'Context: contexts/AuthContext.tsx'
      - 'Zustand/Pinia: stores/authStore.ts'

    routing:
      - 'Route config: routes/index.ts, routes/auth.ts'
      - 'Lazy loading: pages/ directory with dynamic imports'
      - 'Route guards: middleware/ or guards/'

  changelog:
    v1.0:
      - 'Initial SPA structure refactoring workflow'
      - 'Lightweight 2-3 phase design'
      - '3-tier routing (simple/standard/complex)'
      - 'Support for components, state, routing, and full-structure refactoring'
      - 'Incremental changes with continuous testing'
      - 'Compatible with React, Vue, TypeScript, Vite stack'
